[alembic]
script_location = alembic
# env.py imports `api.core.config` — alembic (unlike uvicorn) does not
# automatically add cwd to sys.path, so this must be declared explicitly to work
# even when calling `alembic ...` directly from backend/ (outside Docker, where
# ENV PYTHONPATH=/app already handles this) — see backend/Dockerfile.api for the
# equivalent context.
prepend_sys_path = .
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
